# Publica apps/web (Astro) en GitHub Pages cuando cambian la web o los design tokens, y tras
# cada Release para regenerar el catálogo de extensiones (extensions.json).
# Requiere Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/design-tokens/**
      - .github/workflows/pages.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NX_TUI: false
  NX_DAEMON: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # El workspace npm instala electron; su binario no hace falta para la web.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - run: npx nx run web:build

      # Índice de la última versión publicada de cada extensión: lo lee la app.
      - run: node scripts/extensions.mjs catalog apps/web/dist/extensions.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
