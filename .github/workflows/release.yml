# En cada push a main, Nx Release decide la versión a partir de los Conventional Commits
# (feat → minor, fix → patch, BREAKING CHANGE → major), por separado para la app y para cada
# extensión de extensions/. Si hay versión nueva: commit "chore(release)", tags, CHANGELOG.md,
# release en GitHub y se adjunta el portable (tag vX.Y.Z) o el .zip de la extensión
# (tag ext-<nombre>-vX.Y.Z). Al terminar, el workflow Pages regenera el catálogo.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NX_TUI: false
  NX_DAEMON: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Falla antes de versionar si la app no compila.
      - run: pnpm exec nx run-many -t build

      - name: Identidad de git para el commit de release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Versionar, changelog y release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec nx release --skip-publish

      - name: ¿Hay versión nueva?
        id: tag
        run: echo "tag=$(git tag --points-at HEAD --list 'v*' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Empaquetar portable
        if: steps.tag.outputs.tag != ''
        run: pnpm exec nx run claude-launcher:package

      - name: Adjuntar portable a la release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" apps/claude-launcher/dist/*-portable.exe --clobber

      - name: Empaquetar y adjuntar extensiones publicadas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(git tag --points-at HEAD --list 'ext-*'); do
            project="${tag%-v*}"
            pnpm exec nx run "$project:package"
            gh release upload "$tag" "extensions/${project#ext-}/dist/"*.zip --clobber
            # Las releases de extensiones no deben quitarle a la app el «Latest» de GitHub.
            gh release edit "$tag" --latest=false
          done

      - name: Mantener la app como última release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$app" ]; then gh release edit "$app" --latest; fi
