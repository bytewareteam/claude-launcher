<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Claude Launcher</title>
  <defs>
    <linearGradient id="bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EE9A73"/>
      <stop offset="1" stop-color="#C45A38"/>
    </linearGradient>
    <linearGradient id="shine" x1="256" y1="32" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Ventana del terminal -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)"/>
  <rect x="38" y="38" width="436" height="436" rx="106" fill="none" stroke="url(#shine)" stroke-width="12"/>
  <!-- Prompt: chevron y cursor -->
  <path d="M136 172 228 256 136 340" fill="none" stroke="#1C1512" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M268 340H372" fill="none" stroke="#1C1512" stroke-width="48" stroke-linecap="round"/>
  <!-- Chispa: la IA que arranca -->
  <path d="M354 100Q361 155 406 162Q361 169 354 224Q347 169 302 162Q347 155 354 100Z" fill="#FFF3EA"/>
</svg>
