appId: dev.claude-launcher.app
productName: Claude Launcher
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,.prettierrc.yaml,.editorconfig,components.json,jsconfig.json,README.md}'
  - '!{.env,.env.*,.npmrc}'
  - '!extensions/**'
# Extensiones de la app: fuera del asar para que su utilityProcess las cargue del disco.
extraResources:
  - from: extensions
    to: extensions
asarUnpack:
  - resources/**
win:
  executableName: claude-launcher
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
portable:
  artifactName: ${name}-${version}-portable.${ext}
