<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Claude Launcher</title>
  <desc id="desc">Minimal emblem combining code, a secure vault, and an AI terminal.</desc>
  <defs>
    <linearGradient id="frame" x1="64" y1="90" x2="445" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20C8F5"/>
      <stop offset=".52" stop-color="#477BFF"/>
      <stop offset="1" stop-color="#21D6A0"/>
    </linearGradient>
    <linearGradient id="tile" x1="176" y1="150" x2="332" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#398CFF"/>
      <stop offset="1" stop-color="#765BFF"/>
    </linearGradient>
    <linearGradient id="metal" x1="120" y1="260" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#AFC7E8"/>
    </linearGradient>
  </defs>
  <!-- Open shield / workspace boundary -->
  <path d="M105 239V184Q105 165 122 155L228 94Q256 78 284 94L390 155Q407 165 407 184V235"
        fill="none" stroke="url(#frame)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M105 307V328Q105 347 122 357L211 408M407 307V328Q407 347 390 357L301 408"
        fill="none" stroke="url(#frame)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Code / repository layers -->
  <path d="M178 151 256 110 334 151 256 193Z" fill="url(#tile)"/>
  <path d="M178 174 256 216 334 174" fill="none" stroke="#4F83FF" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m232 145-15 11 15 11M280 145l15 11-15 11M263 139l-14 34" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Secure vault -->
  <circle cx="166" cy="284" r="52" fill="none" stroke="url(#metal)" stroke-width="13"/>
  <rect x="145" y="276" width="42" height="36" rx="8" fill="url(#metal)"/>
  <path d="M153 276v-13a13 13 0 0 1 26 0v13" fill="none" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="166" cy="291" r="4.5" fill="#111B2D"/>
  <path d="m166 294-4 9h8Z" fill="#111B2D"/>
  <!-- Terminal window -->
  <rect x="246" y="246" width="121" height="91" rx="15" fill="#101A2B" stroke="url(#metal)" stroke-width="10"/>
  <path d="M251 266h111" stroke="url(#metal)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="263" cy="257" r="3.5" fill="#B8CBE7"/>
  <circle cx="275" cy="257" r="3.5" fill="#B8CBE7"/>
  <circle cx="287" cy="257" r="3.5" fill="#B8CBE7"/>
  <path d="m270 283 13 12-13 12M291 307h18" fill="none" stroke="#F4F8FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- AI spark -->
  <path d="M365 294c-14-3-19-8-22-22-3 14-8 19-22 22 14 3 19 8 22 22 3-14 8-19 22-22Z" fill="#20D6A0"/>
  <circle cx="349" cy="265" r="4" fill="#20D6A0"/>
</svg>
